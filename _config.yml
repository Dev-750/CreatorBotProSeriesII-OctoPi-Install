theme: minimal-mistakes-jekyll
title: LTC 3D Printer Docs
description: Resources for LTC's Mechatronics/Automation Program 3D printers.
url: "https://dev-750github.io"
baseurl: "/CreatorBotProSeriesII-OctoPi-Install"

# Theme Configuration
plugins:
- jekyll-remote-theme

reomte_theme: "mmistakes/minimal-mistakes@4.24.0"
locale: "en-US"

# Site Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: false
      sidebar:
      nav: "docs"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
